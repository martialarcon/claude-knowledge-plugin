  - "El target generado tiene .vscode/instructions/knowledge-agent.instructions.md"
  - "VS Code Tasks 'Pre-activate KB' y 'Check pending handoffs' aparecen en paleta de tareas"
  - "El workflow KA→Planner funciona en Copilot Chat: usuario pega handoff YAML y Planner genera plan"
  - "KB L0–L7 y handoff/ y plans/ son idénticos a la versión Claude Code (sin cambios)"

